<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171d39">
  <title>Agent Team · The Workshop</title>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/performance.css">
  <link rel="stylesheet" href="/git-tools.css">
  <link rel="stylesheet" href="/remote.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-icon" aria-hidden="true"><span>✦</span></div><div><strong>AGENT TEAM</strong><small>THE WORKSHOP</small></div></div>
      <div class="sidebar-label">YOUR FACTORY</div>
      <button class="nav-item active" data-view="workshop"><span class="nav-icon">▦</span> Workshop <span class="nav-arrow">↗</span></button>
      <button class="nav-item" data-view="library"><span class="nav-icon">▤</span> Shared library <span class="nav-arrow">↗</span></button>
      <button class="nav-item" data-view="bench"><span class="nav-icon">▣</span> Test Bench <span class="nav-arrow">↗</span></button>
      <div class="sidebar-label runs-label">RECENT GOALS</div>
      <div id="run-list" class="run-list"></div>
      <div class="sidebar-foot"><span class="online-dot"></span><span>LOCAL WORKSPACE</span><small id="repo-name"></small></div>
    </aside>

    <main class="main">
      <header class="topbar"><div class="breadcrumb">YOUR FACTORY <span>/</span> <strong id="page-title">WORKSHOP</strong></div><div class="topbar-right"><button class="repo-switcher" id="repo-button" title="Switch repository"><span class="repo-switcher-icon">◇</span><span><small>REPOSITORY</small><strong id="repo-button-name">Choose project</strong></span><b>⌄</b></button><span class="local-tag"><span class="online-dot"></span> RUNNING LOCALLY</span><button class="icon-button" id="options-button" title="Workshop options" aria-label="Workshop options">⚙</button><button class="icon-button" id="refresh-button" title="Refresh" aria-label="Refresh">↻</button></div></header>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>
      <div class="git-toolbar"><button class="secondary-button" id="git-tools-button">◇ Git tools</button></div>
      <section id="main-content"></section>
    </main>

    <aside class="detail-panel" id="detail-panel"></aside>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
